# TEMPORARY probe on a scratch branch (never merged): why does the extraction
# workflow get HTTP 403 on the Economy 7 landing page while the source monitor,
# with the same URL and headers, does not? Read-only: no commits, no issues.
name: Consumer Council source monitor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/source-monitor/probe-403.mjs A
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/source-monitor/probe-403.mjs B
      - run: node scripts/extract/run-pipeline.mjs --out /tmp/p22 --live || true
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/source-monitor/probe-403.mjs C
      - run: node scripts/extract/run-pipeline.mjs --out /tmp/p20 --live || true
