name: TEMP gate-1 evidence fetch

# Temporary, on a scratch branch only. Retrieves the Standard and Economy 7
# PDFs the source monitor already downloaded on 2026-09-15 (run 34965859647)
# and 2026-10-01 (run 36869771782) from their run artefacts, and commits them
# to this branch so the Gate 1 investigation can read them from an
# environment that cannot reach the artefact store. Fetches nothing from the
# Consumer Council. Never touches main. Delete this branch when done.

on:
  push:
    branches: [tmp/gate1-evidence]

permissions:
  actions: read
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the monitor's own artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .evidence
          for pair in 2026-09-15:10395238010 2026-10-01:11165018597; do
            label=${pair%%:*}; id=${pair##*:}
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "/tmp/$label.zip"
            mkdir -p "/tmp/$label" && unzip -o -q "/tmp/$label.zip" -d "/tmp/$label"
            echo "== $label =="; find "/tmp/$label" -type f | sed 's/^/  /'
            find "/tmp/$label" -type f -name '*.pdf' | while read -r f; do
              cp "$f" ".evidence/$label-$(basename "$f")"
            done
          done
          ls -la .evidence
      - name: Commit to this scratch branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .evidence
          git commit -m "tmp: monitor-captured PDFs for the Gate 1 investigation"
          git push origin HEAD:tmp/gate1-evidence
