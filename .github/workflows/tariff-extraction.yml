name: Consumer Council tariff extraction

# Phase 2 of tariff-update automation (issue #17): reads the current Consumer
# Council PDFs, derives a candidate tariff dataset, reconciles it against the
# published one, and opens a PR for a person to review.
#
# What it will never do, and what the job below is shaped to make impossible:
#
#   - merge anything, or enable auto-merge;
#   - deploy anything (publication happens when a human merges the candidate,
#     and GitHub Pages deploys from the default branch);
#   - write to data/ on the default branch, or push to it at all;
#   - propose a tariff-data change from a run that only partly understood the
#     source. The pipeline decides that, not this workflow: it emits an
#     outcome.json and this job only does what the outcome permits.
#
# See docs/EXTRACTION.md.

on:
  schedule:
    # The day after the source monitor's own checks, so a change it has
    # already recorded is extracted on the next run rather than racing it.
    - cron: '41 7 2,16 * *'
  workflow_dispatch:
    inputs:
      use_fixtures:
        description: 'Read the committed text-item fixtures instead of the live site (for exercising the workflow itself)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tariff-extraction
  cancel-in-progress: false

jobs:
  extract:
    name: Extract and reconcile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same Node as the source monitor and CI. The live fetch depends on
      # it: on Node 22 the Consumer Council's Cloudflare front answered the
      # first request of a fresh connection with a challenge (HTTP 403,
      # cf-mitigated: challenge), so Economy 7, fetched first, was refused
      # every run, while the identical request from Node 20 is served.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The extraction has no dependencies to install: it reads the PDFs with
      # Node's own zlib. `npm test` runs the suite that covers it.
      - name: Run the test suite
        run: npm test

      - name: Extract, map and reconcile
        id: run
        run: |
          set -o pipefail
          mkdir -p candidate
          if [ "${{ inputs.use_fixtures }}" = "true" ]; then
            node scripts/extract/run-pipeline.mjs --out candidate | tee candidate/console.log
          else
            node scripts/extract/run-pipeline.mjs --out candidate --live | tee candidate/console.log
          fi

      # Always kept, including on a failed run: the console log and whatever
      # reconciliation was produced are what a person needs to see first.
      - name: Upload the run's artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tariff-extraction-${{ github.run_id }}
          path: candidate/
          if-no-files-found: warn

      - name: Read the outcome
        id: outcome
        run: |
          outcome=$(jq -r '.outcome' candidate/outcome.json)
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "candidate_pr=$(jq -r '.policy.candidate_pr' candidate/outcome.json)" >> "$GITHUB_OUTPUT"
          echo "data_families=$(jq -r '.data_update_families | join(",")' candidate/outcome.json)" >> "$GITHUB_OUTPUT"
          echo "review_only=$(jq -r '.review_only_families | join(",")' candidate/outcome.json)" >> "$GITHUB_OUTPUT"
          # Unique per run and attempt: a new candidate never builds on a
          # branch an earlier, closed or abandoned candidate left behind.
          echo "branch=candidate/tariffs-$(date -u +%Y-%m-%d)-${outcome}-run${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          {
            echo "## Outcome: \`$outcome\`"
            echo
            cat candidate/summary.md | tail -n +2
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build, test and open the candidate pull request
        if: steps.outcome.outputs.candidate_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.outcome.outputs.outcome }}
          DATA_FAMILIES: ${{ steps.outcome.outputs.data_families }}
          REVIEW_ONLY: ${{ steps.outcome.outputs.review_only }}
          BRANCH: ${{ steps.outcome.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ -z "$DATA_FAMILIES" ]; then
            title='Blocked: Consumer Council extraction needs a decision'
          else
            title='Candidate tariff update from the Consumer Council source'
          fi

          # A scheduled run happens twice a month, so the same outcome would
          # otherwise open the same pull request again. An open candidate with
          # this title is updated instead — rebuilt from scratch below, so it
          # always holds exactly what this run produced.
          existing=$(gh pr list --state open --json number,headRefName,title \
            --jq ".[] | select(.headRefName | startswith(\"candidate/\")) | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$existing" ]; then
            BRANCH=$(gh pr view "$existing" --json headRefName --jq .headRefName)
            echo "Updating open candidate #$existing on $BRANCH."
          fi

          # The candidate is always built from the base branch as checked out,
          # never on top of an earlier candidate's commits, so nothing a
          # previous run wrote can linger in it.
          git switch -C "$BRANCH"

          if [ -n "$DATA_FAMILIES" ]; then
            # A data candidate carries the publication and nothing else: the
            # dated dataset, the pointer, and the reconciliation, source-row
            # trace and provenance that stay beside it permanently once
            # merged. The pipeline writes these only for a table it read
            # cleanly and found a real change in. This step adds no policy of
            # its own, except that it never overwrites an existing file other
            # than the two pointers: a correction to an already-published
            # snapshot is published beside it under a revision suffix.
            while IFS= read -r -d '' file; do
              dest=${file#candidate/publish/}
              case "$dest" in
                data/latest.json|data/latest-standard.json) ;;
                *)
                  if [ -e "$dest" ]; then
                    echo "::error title=Refusing to overwrite::$dest already exists; a published file is never replaced in place."
                    exit 1
                  fi
                  ;;
              esac
              mkdir -p "$(dirname "$dest")"
              cp "$file" "$dest"
            done < <(find candidate/publish -type f -print0)
          else
            # A review-only candidate carries no tariff data, only the
            # material a person needs to resolve what blocked it. It is never
            # merged, so this directory never reaches the default branch.
            mkdir -p docs/candidates
            cp candidate/summary.md docs/candidates/summary.md
            cp candidate/reconciliation-*.md candidate/provenance-*.json candidate/source-rows-*.json docs/candidates/ 2>/dev/null || true
          fi

          # Candidate pull requests are opened with GITHUB_TOKEN, which by
          # design triggers no workflows, so no CI will run on them. The full
          # suite therefore runs here, on exactly the tree being proposed —
          # including the deployment tests that check whatever the pointers
          # now name. If it fails, nothing is pushed and no pull request is
          # opened or updated.
          set +e
          npm test > candidate-tests.log 2>&1
          tests_status=$?
          set -e
          tests_summary=$(grep -E '^# (tests|pass|fail) ' candidate-tests.log | sed 's/^# //' | paste -sd ' ' -)
          if [ "$tests_status" -ne 0 ]; then
            grep -E '^not ok' candidate-tests.log || true
            echo "::error title=Candidate failed its tests::The proposed tree does not pass the test suite (${tests_summary}). No pull request has been opened or updated."
            exit 1
          fi
          echo "Candidate tree passes: ${tests_summary}"
          rm -f candidate-tests.log

          git add data docs
          if git diff --cached --quiet; then
            echo 'The candidate changes nothing in the repository; not opening a pull request.'
            exit 0
          fi
          git commit -q -m "candidate: Consumer Council extraction — ${OUTCOME}" -m "$(cat candidate/summary.md)"

          if [ -n "$existing" ]; then
            git fetch -q origin "$BRANCH"
            if [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "origin/$BRANCH^{tree}")" ]; then
              gh pr comment "$existing" --body "Re-ran the extraction ([run]($RUN_URL)): outcome \`${OUTCOME}\`, identical to this candidate. Tests on the candidate tree: ${tests_summary}."
              exit 0
            fi
            # The branch is the workflow's own; it is replaced with this run's
            # candidate so the pull request shows exactly what this run
            # proposes. Changes belong in the code or the recorded decisions,
            # never in a candidate branch.
            git push --force-with-lease="$BRANCH:origin/$BRANCH" origin "$BRANCH"
            {
              printf '%s\n\n' "Re-ran the extraction ([run]($RUN_URL)): outcome \`${OUTCOME}\`. This candidate has been rebuilt from this run. Tests on the candidate tree: **${tests_summary}**."
              cat candidate/summary.md
            } > pr-comment.md
            gh pr comment "$existing" --body-file pr-comment.md
            exit 0
          fi

          git push -u origin "$BRANCH"

          if [ -z "$DATA_FAMILIES" ]; then
            printf '%s\n\n' 'This candidate carries **no tariff data**. The extraction read the source but could not resolve something in it, so nothing here can be merged into the published dataset. Resolve the questions below, then re-run the workflow.' > pr-body.md
          else
            printf '%s\n\n' 'This candidate proposes a tariff-data change. Merging it publishes the new dataset, so **the review on this pull request is the gate**. Check the reconciliation and provenance it adds under `docs/` against the source before merging. Nothing has been merged or deployed automatically.' > pr-body.md
            if [ -n "$REVIEW_ONLY" ]; then
              printf '%s\n\n' "Note: the **${REVIEW_ONLY}** table is blocked on an unresolved question and contributes no data to this candidate; its reconciliation is in the [run's artefact]($RUN_URL). Only ${DATA_FAMILIES} is proposed for publication." >> pr-body.md
            fi
          fi
          printf '%s\n\n' "**Tested before opening:** the full suite passed on exactly this tree — ${tests_summary} ([run]($RUN_URL)). Pull requests opened by this workflow trigger no CI of their own, so this is the test result for this candidate." >> pr-body.md
          cat candidate/summary.md >> pr-body.md
          printf '\n%s\n' '<!-- Opened by .github/workflows/tariff-extraction.yml. Never auto-merged. -->' >> pr-body.md

          if ! gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "$title" \
            --body-file pr-body.md; then
            echo "::error title=Candidate pull request not opened::The branch $BRANCH is pushed and this run's artifacts are uploaded, so nothing the extraction produced is lost. If the message above is \"GitHub Actions is not permitted to create or approve pull requests\", enable Settings -> Actions -> General -> Workflow permissions -> \"Allow GitHub Actions to create and approve pull requests\". The workflow already requests pull-requests: write, which is necessary but not sufficient on its own. Re-run this workflow afterwards."
            exit 1
          fi
